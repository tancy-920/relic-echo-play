<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>遗器回响 · 独立网页试玩</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	image-rendering: pixelated;
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link rel="manifest" href="game072.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<button id="play-button" hidden style="position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 32px;background:#20463f;border:1px solid #c1aa75;border-radius:8px;color:#fff;font-size:20px;cursor:pointer">进入遗器回响<br><small style="font-size:13px">电脑键盘游玩 · 无需登录</small></button>
<button id="fullscreen-play" hidden style="position:absolute;z-index:6;left:50%;top:calc(50% + 95px);transform:translateX(-50%);padding:10px 22px;background:#142b28;border:1px solid #8da695;border-radius:6px;color:#fff;font-size:15px;cursor:pointer">全屏游玩</button>
<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="game072.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="game072.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"game072","experimentalVK":false,"fileSizes":{"game072.pck":30117688,"game072.wasm":38820072},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"game072.service.worker.js"};
const GODOT_THREADS_ENABLED = true;
const engine = new Engine(GODOT_CONFIG);

(async function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// Install this release even when an older worker already provides isolation.
 	try {
 	 const targetWorker = new URL(GODOT_CONFIG.serviceWorker, location.href).href;
 	 const previousController = navigator.serviceWorker.controller;
 	 const registration = await navigator.serviceWorker.register(targetWorker);
 	 const pending = registration.installing || registration.waiting;
 	 if (pending && pending.state !== 'activated') {
 	  await new Promise((resolve,reject)=>{
 	   const timer=setTimeout(()=>reject(new Error('游戏更新超时，请刷新重试。')),30000);
 	   const check=()=>{
 	    if(pending.state==='activated'){clearTimeout(timer);resolve();}
 	    else if(pending.state==='redundant'){clearTimeout(timer);reject(new Error('游戏更新失败，请刷新重试。'));}
 	   };
 	   pending.addEventListener('statechange',check);check();
 	  });
 	 }
 	 if (!navigator.serviceWorker.controller || navigator.serviceWorker.controller.scriptURL !== targetWorker) {
 	  await new Promise((resolve,reject)=>{
 	   const timer=setTimeout(()=>reject(new Error('游戏加载器更新超时，请刷新重试。')),30000);
 	   const check=()=>{if(navigator.serviceWorker.controller?.scriptURL===targetWorker){clearTimeout(timer);resolve();}};
 	   navigator.serviceWorker.addEventListener('controllerchange',check);check();
 	  });
 	 }
 	 if (!previousController || previousController.scriptURL !== targetWorker || pending) {
 	  location.reload();return;
 	 }
 	} catch(error) {displayFailureNotice(error);return;}
 
	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
            // Wait for activation before the first reload; registration alone can race.
            if(sessionStorage.getItem('relic-isolation-retry')==='1') {
                displayFailureNotice('浏览器未能启用多线程环境，请使用新版 Chrome / Edge 独立打开此页。');
            } else {
                sessionStorage.setItem('relic-isolation-retry','1');
                engine.installServiceWorker().then(()=>navigator.serviceWorker.ready).then(()=>window.location.reload()).catch(displayFailureNotice);
            }
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		sessionStorage.removeItem('relic-isolation-retry');
 setStatusMode('progress');
		document.getElementById('play-button').hidden=false; document.getElementById('fullscreen-play').hidden=false; document.getElementById('fullscreen-play').onclick=()=>{document.documentElement.requestFullscreen().catch(()=>{});document.getElementById('play-button').click();};
 document.getElementById('play-button').onclick=()=>{
 document.getElementById('play-button').remove(); document.getElementById('fullscreen-play').remove();
 engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
 };
	}
}());
		</script>
	<script>
if(new URLSearchParams(location.search).has('profile')) {
 const panel=document.createElement('output');panel.id='engine-frame-profile';
 panel.style='position:fixed;z-index:20;bottom:0;right:0;background:#000c;color:white;font:12px monospace;padding:8px';
 panel.textContent='Godot 0.7.2 · 等待引擎开始采样';document.body.append(panel);
}
</script>
</body>
</html>
